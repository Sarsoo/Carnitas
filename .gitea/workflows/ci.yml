name: ci

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Unit Test
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ '10.0.x' ]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install Dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Debug --no-restore
      - name: Test
        run: dotnet test --no-restore --verbosity normal

  buildOci:
    runs-on: ubuntu-latest
    name: Build Container
    if: gitea.event_name == 'push' && (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/'))
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: cr.lab.sarsoo.xyz
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build CLI Container
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: cr.lab.sarsoo.xyz/sarsoo/carnitas/cli:latest
          file: Carnitas.CLI/Dockerfile
          context: .

      - name: Build Web Container
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: cr.lab.sarsoo.xyz/sarsoo/carnitas/web:latest
          file: Carnitas.Web/Dockerfile
          context: .