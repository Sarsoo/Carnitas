syntax = "proto3";

option csharp_namespace = "Carnitas.Grpc";

package agent;

service Agent {
  rpc ReportOperationLogs(stream OperationLog) returns (OperationLogResponse);
  rpc ReportOperationLogBatch(OperationLogBatch) returns (OperationLogBatchResponse);
  rpc ReportOperationStatus(OperationStatusRequest) returns (OperationStatusResponse);
  rpc SubmitOperationPlan(OperationPlanReport) returns (OperationPlanResponse);
  
  rpc RecordRootModules(RootModuleContents) returns (RootModuleReportResponse);

  rpc RenewLease(TaskLeaseRequest) returns (TaskLeaseResponse);

  rpc RequestWorkflow(OperationRequest) returns (WorkflowRequestResponse);
}

/////////////////////////
// ReportOperationLogs
////////////////////////

message OperationLog {
  string operation_id = 1;
  string log = 2;
  string level = 3;
  string type = 4;
}

message OperationLogResponse {
  
}

message OperationLogBatch {
  repeated OperationLog logs = 1;
}

message OperationLogBatchResponse {

}

////////////////////////////////
//   ReportOperationStatus
///////////////////////////////

enum OperationStatusState {
  OPERATION_SUCCESS = 0;
  OPERATION_FAILURE = 1;
  OPERATION_UNKNOWN = 2;
}

message OperationStatusRequest {
  string operation_id = 1;
  OperationStatusState state = 2;
  int32 exit_code = 3;
  string error = 4;
}

message OperationStatusResponse {
  string operation_id = 1;
}

////////////////////////////////
//        RenewLease
///////////////////////////////

message TaskLeaseRequest {
  string task_id = 1;
  string worker_id = 2;
}

message TaskLeaseResponse {
  bool renewed = 1;
}

////////////////////////////////
//     RecordRootModules
///////////////////////////////

message RootModuleContents {
  string operation_id = 1;
  string repository_id = 2;

  repeated string module_paths = 3;
}

message RootModuleReportResponse {
  int32 recorded = 1;
}

////////////////////////////////
//   ReportOperationStatus
///////////////////////////////

message OperationPlanReport {
  string operation_id = 1;
  string plan = 2;
  string plan_file_path = 3;
}

message OperationPlanResponse {

}

////////////////////////////////
//     RequestWorkflow
///////////////////////////////

message OperationRequest {
  string worker_id = 1;
}

message WorkflowRequestResponse {
  string id = 1;
  string repo_url = 2;
  string module_path = 3;
  repeated OperationResponse operations = 4;
  bool has_work = 5;
  string repository_id = 6;
}

message OperationResponse {
  string id = 1;
  OperationType operation = 2;
}

enum OperationType {
  OPERATION_INIT = 0;
  OPERATION_PLAN = 1;
  OPERATION_APPLY = 2;
  OPERATION_DISCOVER_SOURCE = 3;
}